version = 1

# Source: phase3/merged-candidates.json id=lens-B-redact-secrets, lens=B, receipts=1
# Note: the mining draft used regex (console\.(log|error|info)|status|print)\s*\(.*TOKEN|INGEST_TOKEN|API_KEY|SECRET).
# The current ast_grep matcher supports concrete secret-bearing argument patterns. Add more concrete
# token names as the codebase surface grows; full prefix regex scanning still benefits from semgrep.
[[rules]]
id = "research-incidents-redact-secrets"
description = "Do not emit secrets or tokens in daemon status, logs, or CLI output."
severity = "block"
match = ["packages/*/src/**/*.ts", "src/**/*.ts", "scripts/**/*.ts"]
content = [
  { type = "ast_grep", pattern = "console.log(process.env.INGEST_TOKEN)", expect = "present", strictness = "smart" },
  { type = "ast_grep", pattern = "console.error(process.env.INGEST_TOKEN)", expect = "present", strictness = "smart" },
  { type = "ast_grep", pattern = "console.info(process.env.INGEST_TOKEN)", expect = "present", strictness = "smart" },
  { type = "ast_grep", pattern = "console.log(process.env.API_KEY)", expect = "present", strictness = "smart" },
  { type = "ast_grep", pattern = "console.error(process.env.API_KEY)", expect = "present", strictness = "smart" },
  { type = "ast_grep", pattern = "console.log(process.env.MCP_TOKEN)", expect = "present", strictness = "smart" },
  { type = "ast_grep", pattern = "console.error(process.env.MCP_TOKEN)", expect = "present", strictness = "smart" }
]
content_mode = "any"
actions = [
  { type = "block_tool", message = "Secrets or tokens must not be printed in daemon status, logs, or CLI output. Redact or remove the emission before committing." }
]
